name: Build Radio Driver 3.0.2 APK

on:
  push:
    branches:
      - radio-driver-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Radio Driver sources
        shell: bash
        run: |
          set -euo pipefail
          cat radio-driver-xz/part*.txt | tr -d '\n\r' | base64 -d > RadioDriver3-min.tar.xz
          echo "32bc0d05b896c8639de38c85e94b44fa02d8058f684f420c974dd75f4a8f9afc  RadioDriver3-min.tar.xz" | sha256sum -c -
          mkdir -p radio-driver-project
          tar -xJf RadioDriver3-min.tar.xz -C radio-driver-project
          test -f radio-driver-project/build.gradle.kts
          test -f radio-driver-project/app/build.gradle.kts
          test -f radio-driver-project/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        working-directory: radio-driver-project
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="radio-driver-project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee radio-driver-apk-info.txt
          sha256sum "$APK" | tee RadioDriver-3.0.2.apk.sha256

      - name: Prepare named APK
        shell: bash
        run: |
          cp radio-driver-project/app/build/outputs/apk/debug/app-debug.apk RadioDriver-3.0.2-installacyjna.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioDriver-3.0.2-installable-apk
          path: |
            RadioDriver-3.0.2-installacyjna.apk
            RadioDriver-3.0.2.apk.sha256
            radio-driver-apk-info.txt
          if-no-files-found: error
          retention-days: 7
