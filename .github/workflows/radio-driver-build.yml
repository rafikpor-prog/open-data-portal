name: Build Radio Driver 3.0.5 Hotfix APK

on:
  push:
    branches:
      - radio-driver-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Radio Driver 3.0.4 source
        shell: bash
        run: |
          set -euo pipefail
          cat radio-driver-304/src*.txt | tr -d '\n\r' | base64 -d > RadioDriver-3.0.4-ci.tar.xz
          echo "2710b391ca03df6bdd2c080cab508069ef15c8897188b81a94c6d15355572327  RadioDriver-3.0.4-ci.tar.xz" | sha256sum -c -
          mkdir -p radio-driver-project
          tar -xJf RadioDriver-3.0.4-ci.tar.xz -C radio-driver-project --strip-components=1

      - name: Apply 3.0.5 startup hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("radio-driver-project")

          def replace(path, old, new, count=-1):
              p=root/path
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old[:80]!r}")
              s=s.replace(old,new,count)
              p.write_text(s)

          replace("app/build.gradle.kts", "versionCode = 3000400", "versionCode = 3000500")
          replace("app/build.gradle.kts", 'versionName = "3.0.4"', 'versionName = "3.0.5"')

          replace("app/src/main/java/pl/radiodriver/app/data/local/AppDatabase.kt",
                  "version = 2,", "version = 3,")

          p=root/"app/src/main/java/pl/radiodriver/app/core/AppContainer.kt"
          s=p.read_text()
          s=s.replace(".addMigrations(MIGRATION_1_2)", ".addMigrations(MIGRATION_1_2, MIGRATION_2_3)")
          marker="\n    }\n}"
          idx=s.rfind(marker)
          if idx < 0:
              raise SystemExit("AppContainer companion marker not found")
          migration=r'''
              /**
               * 3.0.5 hotfix: non-destructive validation pass for installations
               * upgraded from 3.0.4. Station and history data are preserved.
               */
              val MIGRATION_2_3 = object : Migration(2, 3) {
                  override fun migrate(db: SupportSQLiteDatabase) {
                      db.execSQL(
                          """CREATE TABLE IF NOT EXISTS `schedules` (
                              `id` INTEGER PRIMARY KEY AUTOINCREMENT NOT NULL,
                              `stationId` TEXT NOT NULL,
                              `stationName` TEXT NOT NULL,
                              `streamUrl` TEXT NOT NULL,
                              `logoUrl` TEXT NOT NULL,
                              `hour` INTEGER NOT NULL,
                              `minute` INTEGER NOT NULL,
                              `daysMask` INTEGER NOT NULL,
                              `enabled` INTEGER NOT NULL,
                              `createdAt` INTEGER NOT NULL
                          )""".trimIndent()
                      )
                  }
              }
          '''
          s=s[:idx]+migration+s[idx:]
          p.write_text(s)

          p=root/"app/src/main/java/pl/radiodriver/app/MainActivity.kt"
          s=p.read_text()
          s=s.replace("    private lateinit var manualBackup: ManualBackupManager\n","")
          s=s.replace("manualBackup.exportTo(uri)","manualBackupManager().exportTo(uri)")
          s=s.replace("manualBackup.importFrom(uri)","manualBackupManager().importFrom(uri)")
          s=s.replace("manualBackup.suggestedFileName()","manualBackupManager().suggestedFileName()")
          s=s.replace("        manualBackup = ManualBackupManager(this, app.repository, app.container.settings)\n","")
          old="""        locationPermission.launch(arrayOf(Manifest.permission.ACCESS_COARSE_LOCATION, Manifest.permission.ACCESS_FINE_LOCATION))
                  if (Build.VERSION.SDK_INT >= 33) notificationPermission.launch(Manifest.permission.POST_NOTIFICATIONS)

                  setContent { RadioDriverTheme { App() } }"""
          new="""        setContent { RadioDriverTheme { App() } }

                  window.decorView.post {
                      runCatching {
                          locationPermission.launch(arrayOf(Manifest.permission.ACCESS_COARSE_LOCATION, Manifest.permission.ACCESS_FINE_LOCATION))
                      }.onFailure { backupStatus = "Nie udało się uruchomić prośby o lokalizację." }
                  }"""
          if old not in s:
              raise SystemExit("MainActivity startup block not found")
          s=s.replace(old,new)
          oldcb="""    private val locationPermission = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { m ->
                  val locationGranted = m[Manifest.permission.ACCESS_FINE_LOCATION] == true || m[Manifest.permission.ACCESS_COARSE_LOCATION] == true
                  if (locationGranted) loadLocation() else backupStatus = "Bez lokalizacji pogoda i alerty będą miały ograniczony zakres."
              }"""
          newcb="""    private val locationPermission = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { m ->
                  val locationGranted = m[Manifest.permission.ACCESS_FINE_LOCATION] == true || m[Manifest.permission.ACCESS_COARSE_LOCATION] == true
                  if (locationGranted) loadLocation() else backupStatus = "Bez lokalizacji pogoda i alerty będą miały ograniczony zakres."
                  if (Build.VERSION.SDK_INT >= 33) {
                      runCatching { notificationPermission.launch(Manifest.permission.POST_NOTIFICATIONS) }
                  }
              }"""
          if oldcb not in s:
              raise SystemExit("MainActivity permission callback not found")
          s=s.replace(oldcb,newcb)
          helper="""    private fun manualBackupManager(): ManualBackupManager {
                  val app = application as RadioDriverApp
                  return ManualBackupManager(this, app.repository, app.container.settings)
              }

          """
          s=s.replace("    private fun loadLocation() = LocationHelper(this).last(\n", helper+"    private fun loadLocation() = LocationHelper(this).last(\n")
          p.write_text(s)

          p=root/"app/src/main/java/pl/radiodriver/app/MainViewModel.kt"
          s=p.read_text()
          s=s.replace("import kotlinx.coroutines.flow.StateFlow\n", "import kotlinx.coroutines.flow.StateFlow\nimport kotlinx.coroutines.flow.catch\n")
          s=s.replace("repo.favorites.stateIn(", "repo.favorites.catch { emit(emptyList()) }.stateIn(")
          s=s.replace("repo.custom.stateIn(", "repo.custom.catch { emit(emptyList()) }.stateIn(")
          s=s.replace("repo.recent.stateIn(", "repo.recent.catch { emit(emptyList()) }.stateIn(")
          s=s.replace("repo.schedules.stateIn(", "repo.schedules.catch { emit(emptyList()) }.stateIn(")
          oldtop="""    fun top() = viewModelScope.launch {
                  _directoryStatus.value = "Ładowanie popularnych stacji…"
                  _discover.value = repo.top()
                  _directoryStatus.value = if (_discover.value.isEmpty()) "Katalog chwilowo niedostępny" else "${_discover.value.size} stacji"
              }"""
          newtop="""    fun top() = viewModelScope.launch {
                  _directoryStatus.value = "Ładowanie popularnych stacji…"
                  runCatching { repo.top() }
                      .onSuccess { list ->
                          _discover.value = list
                          _directoryStatus.value = if (list.isEmpty()) "Katalog chwilowo niedostępny" else "${list.size} stacji"
                      }
                      .onFailure {
                          _discover.value = emptyList()
                          _directoryStatus.value = "Katalog chwilowo niedostępny"
                      }
              }"""
          if oldtop not in s:
              raise SystemExit("MainViewModel top() block not found")
          s=s.replace(oldtop,newtop)
          p.write_text(s)

          for rel in [
              "app/src/main/java/pl/radiodriver/app/backup/GoogleDriveBackupManager.kt",
              "app/src/main/java/pl/radiodriver/app/backup/ManualBackupManager.kt",
              "app/src/main/java/pl/radiodriver/app/playback/RadioPlaybackService.kt",
          ]:
              p=root/rel
              p.write_text(p.read_text().replace("3.0.4","3.0.5"))

          assert "versionCode = 3000500" in (root/"app/build.gradle.kts").read_text()
          assert "version = 3" in (root/"app/src/main/java/pl/radiodriver/app/data/local/AppDatabase.kt").read_text()
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        working-directory: radio-driver-project
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="radio-driver-project/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee radio-driver-3.0.5-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee radio-driver-3.0.5-info.txt
          grep -q "package: name='pl.radiodriver.app'" radio-driver-3.0.5-info.txt
          grep -q "versionCode='3000500'" radio-driver-3.0.5-info.txt
          grep -q "versionName='3.0.5'" radio-driver-3.0.5-info.txt
          sha256sum "$APK" | tee RadioDriver-3.0.5-ci-debug.apk.sha256

      - name: Prepare artifact
        shell: bash
        run: |
          cp radio-driver-project/app/build/outputs/apk/debug/app-debug.apk RadioDriver-3.0.5-ci-debug.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner-36.0.0.jar

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: RadioDriver-3.0.5-ci
          path: |
            RadioDriver-3.0.5-ci-debug.apk
            RadioDriver-3.0.5-ci-debug.apk.sha256
            radio-driver-3.0.5-info.txt
            radio-driver-3.0.5-signature.txt
            apksigner-36.0.0.jar
          if-no-files-found: error
          retention-days: 7
